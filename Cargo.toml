[package]
name = "farsh"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[build-dependencies]
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = "0.29.0"
flate2 = "1.1.10"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SRP's protocol, as Som's own crate (a rev of Som, moved on deliberately)
srp_client = { git = "https://github.com/errordnk/som", rev = "26df1e8f373199653315a502efd1498578f6f072" }
sevenz-rust2 = { version = "0.24.2", features = ["deflate"] }
tar = "0.4.46"
vt100 = "0.18.1"
symphonia = { version = "0.5", features = ["mp3", "flac"] }
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "gif"] }
zip = { version = "9.3.0", default-features = false, features = ["aes-crypto", "deflate", "deflate64", "lzma", "ppmd", "bzip2"] }
# The internal editor and the viewer's text: fresh, our fork (GPL-3.0, as farsh
# is), built in as a library through `fresh::embed::Session` - no plugins (farsh
# will have its own, in Lua), no LSP, no menus. A rev of the fork, moved on
# deliberately like srp_client's. See docs/fresh-plan.md.
fresh-editor = { git = "https://github.com/errordnk/fresh", rev = "c98df16fd", default-features = false, features = ["runtime", "tree-sitter"] }
fresh-input-parser = { git = "https://github.com/errordnk/fresh", rev = "c98df16fd" }
ratatui = { version = "0.30.0", default-features = false, features = ["std", "underline-color"] }

[target.'cfg(windows)'.dependencies]
# the streams of a video (src/srp/streams.rs), as somsrp probes them
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }
zstd = "0.13"
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_NetworkManagement_NetManagement", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
